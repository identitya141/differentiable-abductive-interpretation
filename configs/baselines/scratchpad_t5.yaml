# Scratchpad T5 Baseline Configuration
# T5 with scratchpad for intermediate computation

baseline_type: "scratchpad"
name: "Scratchpad T5"

# Model settings
model:
  base_model: "t5-small"
  max_source_length: 256  # Longer for scratchpad marker
  max_target_length: 512  # Longer for scratchpad + answer

# Scratchpad-specific settings
scratchpad:
  start_token: "[SCRATCH]"
  end_token: "[/SCRATCH]"
  add_special_tokens: true

# Training settings
training:
  num_epochs: 30
  train_batch_size: 32
  eval_batch_size: 64
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler: "cosine_with_warmup"
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0

# Checkpointing
save_strategy: "epoch"
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: "eval_loss"

# Evaluation
eval_strategy: "epoch"
predict_with_generate: true
generation_max_length: 512

# Reproducibility
seed: 42
deterministic: true
