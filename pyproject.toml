[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "differentiable-abductive-interpretation"
version = "1.0.0"
description = "Neurosymbolic Program Induction via Differentiable Abstract Interpretation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Adetayo Okunoye"}]
keywords = [
    "machine-learning",
    "deep-learning",
    "transformers",
    "compositional-generalization",
    "abstract-interpretation",
    "neurosymbolic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "sentencepiece>=0.2.0",
    "datasets>=2.16.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "hydra-core>=1.3.0",
    "wandb>=0.16.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]
viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.scripts]
dai-train = "scripts.train:main"
dai-evaluate = "scripts.evaluate:main"

[project.urls]
Homepage = "https://github.com/identitya141/differentiable-abductive-interpretation"
Repository = "https://github.com/identitya141/differentiable-abductive-interpretation"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | checkpoints
  | data
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]
skip = ["checkpoints", "data", ".venv"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["checkpoints", "data"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
