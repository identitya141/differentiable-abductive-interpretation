baseline_type: "tinyllama_lora"
name: "TinyLlama 1.1B with LoRA"

model:
  base_model: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  max_source_length: 512
  max_target_length: 256

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

quantization:
  use_4bit: true
  quant_type: "nf4"
  compute_dtype: "float16"
  use_double_quant: true

training:
  num_epochs: 10
  train_batch_size: 4
  eval_batch_size: 8
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler: "cosine_with_warmup"
  gradient_accumulation_steps: 8
  max_grad_norm: 1.0

seed: 42
deterministic: true
